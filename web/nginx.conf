server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # (A) 브라우저 메인 웹페이지 응답
    location / {
        try_files $uri $uri/ /index.html;
    }

    # (B) 외부 접속 검증용 헬스체크 엔드포인트 (GET /health -> 200 OK "OK")
    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }
}
